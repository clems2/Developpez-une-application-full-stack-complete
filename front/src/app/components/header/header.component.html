<header class="header">
  <span class="header__brand">MDD</span>

  <!-- Bouton burger : visible en mobile uniquement (CSS) -->
  <button mat-icon-button class="header__burger" type="button"
          [attr.aria-expanded]="menuOpen()" aria-label="Ouvrir le menu"
          (click)="toggleMenu()">
    <mat-icon>{{ menuOpen() ? 'close' : 'menu' }}</mat-icon>
  </button>

  <!-- Navigation : en ligne sur desktop, panneau déroulant sur mobile.
       Les liens sont des `a mat-button` : ils restent des liens (routerLink, accessibles,
       routerLinkActive) mais portent la typographie Material, uniforme avec les actions
       profil/déconnexion du menu mobile. -->
  <nav class="header__nav" [class.header__nav--open]="menuOpen()">
    @for (link of links(); track link.path) {
      <a mat-button class="header__link" [routerLink]="link.path"
         routerLinkActive="header__link--active" (click)="closeMenu()">{{ link.label }}</a>
    }

    <!-- Mobile uniquement : profil et déconnexion regroupés dans le burger -->
    <button mat-button class="header__mobile-action" type="button" (click)="onProfile()">
      Mon profil
    </button>
    <button mat-button class="header__mobile-action header__logout" type="button" (click)="onLogout()">
      Se déconnecter
    </button>
  </nav>

  <!-- Desktop uniquement : icône utilisateur ouvrant un menu (profil / déconnexion) -->
  <button mat-icon-button class="header__user" type="button"
          [matMenuTriggerFor]="userMenu" aria-label="Menu utilisateur">
    <mat-icon>account_circle</mat-icon>
  </button>
  <mat-menu #userMenu="matMenu">
    <button mat-menu-item type="button" (click)="onProfile()">
      <mat-icon>person</mat-icon>
      <span>Mon profil</span>
    </button>
    <button mat-menu-item type="button" (click)="onLogout()">
      <mat-icon>logout</mat-icon>
      <span>Se déconnecter</span>
    </button>
  </mat-menu>
</header>
