<header class="header">
  <span class="header__brand">MDD</span>

  <!-- Bouton burger : visible en mobile uniquement (CSS) -->
  <button mat-icon-button class="header__burger" type="button"
          [attr.aria-expanded]="menuOpen()" aria-label="Ouvrir le menu"
          (click)="toggleMenu()">
    <mat-icon>{{ menuOpen() ? 'close' : 'menu' }}</mat-icon>
  </button>

  <!-- Desktop : liens en ligne. Les mêmes liens servent aussi au panneau mobile ci-dessous. -->
  <nav class="header__nav-desktop">
    @for (link of links(); track link.path) {
      <a mat-button class="header__link" [routerLink]="link.path"
         routerLinkActive="header__link--active">{{ link.label }}</a>
    }
  </nav>

  <!-- Desktop uniquement : icône utilisateur ouvrant un menu (profil / déconnexion) -->
  <button mat-icon-button class="header__user" type="button"
          [matMenuTriggerFor]="userMenu" aria-label="Menu utilisateur">
    <mat-icon>account_circle</mat-icon>
  </button>
  <mat-menu #userMenu="matMenu">
    <button mat-menu-item type="button" (click)="onProfile()">
      <mat-icon>person</mat-icon>
      <span>Mon profil</span>
    </button>
    <button mat-menu-item type="button" (click)="onLogout()">
      <mat-icon>logout</mat-icon>
      <span>Se déconnecter</span>
    </button>
  </mat-menu>
</header>

<!-- Fond assombri : présent uniquement quand le panneau est ouvert, ferme au clic. -->
@if (menuOpen()) {
  <div class="header__backdrop" (click)="closeMenu()" aria-hidden="true"></div>
}

<!-- Panneau latéral mobile : glisse depuis la droite. Contient navigation + profil +
     déconnexion. Toujours dans le DOM (l'animation de translation joue à l'ouverture) ;
     rendu inerte pour les lecteurs d'écran quand il est fermé. -->
<nav
  class="header__panel"
  [class.header__panel--open]="menuOpen()"
  [attr.aria-hidden]="!menuOpen()"
  [attr.inert]="menuOpen() ? null : ''"
  role="dialog"
  aria-modal="true"
  aria-label="Menu de navigation"
>
  <button mat-icon-button class="header__panel-close" type="button"
          aria-label="Fermer le menu" (click)="closeMenu()">
    <mat-icon>close</mat-icon>
  </button>

  @for (link of links(); track link.path) {
    <a mat-button class="header__panel-link" [routerLink]="link.path"
       routerLinkActive="header__link--active" (click)="closeMenu()">{{ link.label }}</a>
  }

  <button mat-button class="header__panel-link" type="button" (click)="onProfile()">
    Mon profil
  </button>
  <button mat-button class="header__panel-link header__logout" type="button" (click)="onLogout()">
    Se déconnecter
  </button>
</nav>
