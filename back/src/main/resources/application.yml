spring:
  application:
    name: mdd-api
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:mdd}?createDatabaseIfNotExist=true&serverTimezone=UTC
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    open-in-view: false
    hibernate:
      # validate : Hibernate ne crée/ne modifie plus le schéma. C'est Flyway qui
      # le construit (db/migration). Au démarrage, Hibernate vérifie seulement que
      # les entités correspondent au schéma migré et plante sinon (garde-fou).
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  flyway:
    # Actif par défaut en dev/prod ; exécute db/migration au démarrage.
    enabled: true
app:
  jwt:
    secret: ${JWT_SECRET:}
    expiration-ms: 604800000   # 7 jours